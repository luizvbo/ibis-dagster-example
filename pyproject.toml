[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ibis-dagster-example"
version = "0.1.0"
description = "Example Dagster project using Ibis to run the same pipeline on DuckDB, Polars, or PySpark"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.9",
    "dagster-webserver>=1.9",
    "ibis-framework[duckdb,polars]>=10",
    # ibis declares sqlglot>=23.4 unbounded; sqlglot>=30 breaks ibis's
    # generated DDL (e.g. DROP TABLE renders without a table name)
    "sqlglot>=26,<30",
    "tabulate>=0.9",
]

[project.optional-dependencies]
# ibis pins pyspark<4.1 for now; Spark 4.0 runs on JDK 17/21 only (on
# JDK 23+ startup fails with `getSubject is not supported`). Spark 4.2
# adds Java 25 support, so a future ibis release lifts the restriction.
pyspark = ["ibis-framework[pyspark]>=10"]
# dev pulls the pyspark + bigquery extras so the compile tests can check
# dialect output without needing a JVM or credentials
dev = ["pytest>=8", "ibis-framework[bigquery,pyspark]>=10"]

# uv auto-includes this group in `uv run`/`uv sync` (mirrors the dev extra
# for pip users)
[dependency-groups]
dev = ["pytest>=8", "ibis-framework[bigquery,pyspark]>=10"]

[tool.hatch.build.targets.wheel]
packages = ["src/ibis_dagster_example"]

[tool.dagster]
module_name = "ibis_dagster_example.definitions"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# memtable fixtures: naive datetimes mirror the CSV sources' schema
"src/ibis_dagster_example/data.py" = ["DTZ001"]
# helpers skip a backend on ANY start failure — blind except is intentional
"tests/**" = ["BLE001"]

# resolve imports against the project's own venv (pyspark lives in the
# dev group), not whatever env happens to be active
[tool.ty.environment]
python = ".venv"
